name: Build and Deploy Integrated App to Azure

on:
  push:
    branches: [ "main", "initial-website" ]
    paths-ignore:
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: incn-pp-thirecon-dh-597-app
  AZURE_CONTAINER_REGISTRY: incnppthadidh969acr
  IMAGE_NAME: th-ireconcile-integrated
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: [self-hosted, nestle-aoa-lx-mariner-gh]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        # Explicitly create and use a new builder that supports cache exports
        install: true
        use: true
        driver-opts: |
          image=moby/buildkit:buildx-stable-1

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v2
      with:
        login-server: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}, ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
        #cache-from: type=registry,ref=${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:buildcache
        #cache-to: type=registry,ref=${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    runs-on: [self-hosted, nestle-aoa-lx-mariner-gh]
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        slot-name: 'production'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        images: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
